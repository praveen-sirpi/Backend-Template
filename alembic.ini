# Alembic configuration.
#
# The database URL is NOT set here: alembic/env.py reads DATABASE_URL from the app settings
# (environment / .env), so the app and migrations always target the same database.
# Logging also comes from the app (src/core/logging.py), so migrations log in the same format.

[alembic]
script_location = %(here)s/alembic

# Sortable, dated file names: 2026_10_06_1025-<rev>_<slug>.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
truncate_slug_length = 40

prepend_sys_path = .
path_separator = os
output_encoding = utf-8


[post_write_hooks]
# Lint and format newly generated revisions with ruff (dev dependency).
hooks = ruff_format, ruff_check

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix --quiet --exit-zero REVISION_SCRIPT_FILENAME
